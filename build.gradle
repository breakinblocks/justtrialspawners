buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'java'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '0.5.1'
}

apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, 'justtrialspawners.refmap.json'
    config 'justtrialspawners.mixins.json'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Enable mixin refmap remapping so third-party mods' SRG refmaps work with parchment
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
        client {
            workingDirectory project.file('run')
        }
        server {
            workingDirectory project.file('run')
        }
        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        url "https://repo.spongepowered.org/repository/maven-public/"
        content { includeGroup "org.spongepowered" }
    }
    maven {
        url "https://maven.saps.dev/minecraft"
        content { includeGroup "dev.ftb.mods" }
    }
    maven {
        url "https://maven.architectury.dev/"
        content { includeGroup "dev.architectury" }
    }
    maven {
        // JEI
        url "https://maven.blamejared.com/"
        content { includeGroup "mezz.jei" }
    }
    maven {
        // CurseForge
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin annotation processor for refmap generation
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // FTB Library + Architectury - required dependencies (via CurseForge maven for fg.deobf compatibility)
    implementation fg.deobf("curse.maven:ftb-library-forge-404465:7296748")
    implementation fg.deobf("curse.maven:architectury-api-419699:5137938")

    // JEI - dev environment
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:15.20.0.106")

    // Jade - dev environment (Forge 1.20.1)
    runtimeOnly fg.deobf("curse.maven:jade-324717:6855440")
}

jar {
    manifest {
        attributes([
            'Specification-Title'  : mod_id,
            'Specification-Version': mod_version,
            'Implementation-Title' : mod_id,
            'Implementation-Version': mod_version,
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            name = "BreakInBlocks"
            url = version.toString().endsWith("-SNAPSHOT") ?
                "https://maven.breakinblocks.com/snapshots" :
                "https://maven.breakinblocks.com/releases"
            credentials {
                username = System.getenv("MAVEN_USER") ?: ""
                password = System.getenv("MAVEN_TOKEN") ?: ""
            }
        }
    }
}

publishMods {
    file = jar.archiveFile
    def changelogFile = file("metadata/changelogs/${version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${version}"
    type = STABLE
    modLoaders.add("forge")

    curseforge {
        projectId = "1509987"
        projectSlug = "bettertrialspawners"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        clientRequired = true
        serverRequired = true
        requires("ftb-library-forge", "architectury-api")
    }
}

tasks.named('publishMods') {
    def mavenUser = providers.environmentVariable("MAVEN_USER")
    if (mavenUser.isPresent()) {
        dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
    }
}

tasks.matching { it.name in ['publishMods', 'publishCurseforge', 'publishModrinth', 'publishGithub'] }.configureEach {
    dependsOn 'reobfJar'
    mustRunAfter 'reobfJar'
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn 'reobfJar'
    mustRunAfter 'reobfJar'
}

tasks.withType(PublishToMavenLocal).configureEach {
    dependsOn 'reobfJar'
    mustRunAfter 'reobfJar'
}
